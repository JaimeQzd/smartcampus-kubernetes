apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smartcampus

spec:
  # La práctica exige al menos dos réplicas.
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: smartcampus-kubernetes-backend:latest

          # Utilizaremos una imagen cargada localmente
          # dentro de Minikube.
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: APP_ENV

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: smartcampus-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartcampus-secret
                  key: DB_PASSWORD

            - name: HOST
              value: "0.0.0.0"

            - name: PORT
              value: "8000"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 10