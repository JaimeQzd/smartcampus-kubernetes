apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: smartcampus

spec:
  serviceName: database-service
  replicas: 1

  selector:
    matchLabels:
      app: database

  template:
    metadata:
      labels:
        app: database

    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine

          ports:
            - containerPort: 5432
              name: postgres

          env:
            # Nombre de la base de datos.
            # Se obtiene del ConfigMap.
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: DB_NAME

            # Usuario sensible.
            # Se obtiene del Secret.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: smartcampus-secret
                  key: DB_USER

            # Contraseña sensible.
            # Se obtiene del Secret.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartcampus-secret
                  key: DB_PASSWORD

            # Guardamos los datos dentro de una subcarpeta
            # del volumen persistente.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

            initialDelaySeconds: 15
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 1Gi