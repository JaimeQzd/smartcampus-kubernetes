services:
  # Base de datos PostgreSQL
  database:
    image: postgres:17-alpine
    container_name: smartcampus-database

    environment:
      POSTGRES_DB: ${DB_NAME:-smartcampus}
      POSTGRES_USER: ${DB_USER:-smartcampus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcampus_password}

    volumes:
      # Guarda los datos aunque eliminemos el contenedor.
      - postgres-data:/var/lib/postgresql/data

      # Script de inicializacion del proyecto.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - smartcampus-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-smartcampus} -d ${DB_NAME:-smartcampus}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  # API FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: smartcampus-backend

    environment:
      APP_ENV: ${APP_ENV:-development}

      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-smartcampus}
      DB_USER: ${DB_USER:-smartcampus}
      DB_PASSWORD: ${DB_PASSWORD:-smartcampus_password}

      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}

    ports:
      - "${PORT:-8000}:8000"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - smartcampus-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


volumes:
  # Volumen persistente de PostgreSQL.
  postgres-data:


networks:
  # Red interna para la comunicacion entre servicios.
  smartcampus-network:
    driver: bridge