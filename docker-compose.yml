services:
  # Base de datos PostgreSQL
  database:
    image: postgres:17-alpine
    container_name: smartcampus-database

    environment:
      POSTGRES_DB: ${DB_NAME:-smartcampus}
      POSTGRES_USER: ${DB_USER:-smartcampus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcampus_password}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - smartcampus-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-smartcampus} -d ${DB_NAME:-smartcampus}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # API REST FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: smartcampus-backend

    environment:
      APP_ENV: ${APP_ENV:-development}

      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-smartcampus}
      DB_USER: ${DB_USER:-smartcampus}
      DB_PASSWORD: ${DB_PASSWORD:-smartcampus_password}

      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}

    ports:
      - "${PORT:-8000}:8000"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - smartcampus-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  # Interfaz web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: smartcampus-frontend

    environment:
      # Dentro de la red Docker el frontend
      # encuentra al backend por su nombre de servicio.
      BACKEND_URL: http://backend:8000

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - smartcampus-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


volumes:
  postgres-data:


networks:
  smartcampus-network:
    driver: bridge